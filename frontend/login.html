<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trading Station — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Roboto', 'sans-serif'] }, screens: { xs: '480px' } } } };
</script>
<link rel="stylesheet" href="/static/style.css?v=1787100000" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex items-center justify-center px-5">

<div class="w-full max-w-sm">
  <div class="flex items-center justify-center gap-2 mb-6">
    <img src="/static/logo.svg" class="w-8 h-8 rounded-[0.3rem]" alt="" />
    <span class="text-lg font-semibold text-slate-900">Trading Station</span>
  </div>

  <form id="loginForm" class="bg-white border border-slate-200 shadow-sm rounded-xl p-6 flex flex-col gap-4">
    <h1 class="text-base font-medium text-slate-900 mb-1">Sign in</h1>

    <div>
      <label class="field-label">Username</label>
      <input name="username" required autocomplete="username" autofocus class="field-input" />
    </div>
    <div>
      <label class="field-label">Password</label>
      <input name="password" type="password" required autocomplete="current-password" class="field-input" />
    </div>

    <div id="loginError" class="hidden text-xs text-red-600"></div>

    <button type="submit" class="relative inline-flex items-center justify-center h-11 px-6 rounded-[0.3rem] text-sm font-medium bg-blue-600 text-white shadow-sm hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
      Sign in
    </button>
  </form>
</div>

<script>
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("loginError");

  // if there's already a valid session, skip straight past the login page
  // instead of making the person sign in again for no reason
  fetch("/api/status").then((r) => { if (r.ok) location.href = "/"; }).catch(() => {});

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    const fd = new FormData(form);
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        errorEl.textContent = body.detail || "Sign in failed.";
        errorEl.classList.remove("hidden");
        submitBtn.disabled = false;
        return;
      }
      const params = new URLSearchParams(location.search);
      location.href = params.get("next") || "/";
    } catch (err) {
      errorEl.textContent = "Couldn't reach the server: " + err.message;
      errorEl.classList.remove("hidden");
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
